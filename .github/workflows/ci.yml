name: PostcodeLink CI Pipeline

on:
  push:
    branches: [main, "release-gate-**", "release-**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  backend-verification:
    name: Backend Security, RBAC & API Tests (PostgreSQL & SQLite)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: postcodelink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Alembic Migrations on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@localhost:5432/postcodelink_test
        run: |
          python -m alembic upgrade head

      - name: Verify Database Seeding on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@localhost:5432/postcodelink_test
        run: |
          python -m backend.app.seed

      - name: Execute Pytest Security & API Regression Test Suite (PostgreSQL)
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@localhost:5432/postcodelink_test
          SECRET_KEY: "postcodelink_ci_secret_key_32_characters_minimum"
          OUTBOX_ENCRYPTION_KEY: "postcodelink_ci_outbox_key_32_characters_minimum"
          ENVIRONMENT: "development"
          REDIS_URL: "redis://localhost:6379/0"
        run: |
          python -m pytest backend/tests -v

      - name: Verify SQLite Migrations & Test Compatibility (Local Fallback)
        env:
          DATABASE_URL: sqlite:///./postcodelink_ci_test.db
          SECRET_KEY: "postcodelink_ci_secret_key_32_characters_minimum"
          OUTBOX_ENCRYPTION_KEY: "postcodelink_ci_outbox_key_32_characters_minimum"
          ENVIRONMENT: "development"
          REDIS_URL: "redis://localhost:6379/0"
        run: |
          python -m alembic upgrade head
          python -m backend.app.seed
          python -m pytest backend/tests -v

  frontend-verification:
    name: Frontend Build, TypeScript & State Machine Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install NPM Dependencies (Reproducible CI)
        run: npm ci

      - name: Run Frontend State Machine & Security Tests
        run: npm test

      - name: Execute ESLint Verification
        run: npm run lint

      - name: Verify Next.js Production Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Suite
        run: npm run test:e2e

  fullstack-e2e:
    name: Full-Stack Browser-to-FastAPI E2E (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: postcodelink_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          npm ci
          npx playwright install --with-deps chromium

      - name: Migrate & Seed PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@localhost:5432/postcodelink_e2e
        run: |
          python -m alembic upgrade head
          python -m backend.app.seed

      - name: Build Next.js App
        env:
          NEXT_PUBLIC_FASTAPI_URL: http://127.0.0.1:8000
        run: npm run build

      - name: Start FastAPI & Run Full-Stack Playwright E2E
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@localhost:5432/postcodelink_e2e
          SECRET_KEY: "postcodelink_ci_secret_key_32_characters_minimum"
          OUTBOX_ENCRYPTION_KEY: "postcodelink_ci_outbox_key_32_characters_minimum"
          ENVIRONMENT: "development"
          REDIS_URL: "redis://localhost:6379/0"
          NEXT_PUBLIC_FASTAPI_URL: http://127.0.0.1:8000
        run: |
          PROCESS_ROLE=api uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health/live && break || sleep 1; done
          npm run test:e2e:fullstack
