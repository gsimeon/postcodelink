name: PostcodeLink CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-verification:
    name: Backend Security, RBAC & API Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Alembic Database Migrations
        run: |
          python -m alembic upgrade head

      - name: Verify Database Seeding
        run: |
          python -m backend.app.seed

      - name: Execute Pytest Security & API Regression Test Suite
        env:
          SECRET_KEY: "postcodelink_ci_secret_key_32_characters_minimum"
          ENVIRONMENT: "development"
        run: |
          python -m pytest backend/tests -v

  frontend-verification:
    name: Frontend Build, TypeScript & State Machine Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install NPM Dependencies
        run: npm install

      - name: Run Frontend State Machine & Security Tests
        run: npm test

      - name: Verify Next.js Production Build
        run: npm run build
