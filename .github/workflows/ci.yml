name: PostcodeLink CI Pipeline

on:
  push:
    branches: [main, "release-gate-**", "release-**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  backend-verification:
    name: Backend Security, RBAC & API Tests (PostgreSQL & SQLite)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: postcodelink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Alembic Migrations on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@localhost:5432/postcodelink_test
        run: |
          python -m alembic upgrade head

      - name: Verify Database Seeding on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@localhost:5432/postcodelink_test
        run: |
          python -m backend.app.seed

      - name: Execute Pytest Security & API Regression Test Suite (PostgreSQL)
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@localhost:5432/postcodelink_test
          SECRET_KEY: "postcodelink_ci_secret_key_32_characters_minimum"
          OUTBOX_ENCRYPTION_KEY: "postcodelink_ci_outbox_key_32_characters_minimum"
          ENVIRONMENT: "development"
          REDIS_URL: "redis://localhost:6379/0"
        run: |
          python -m pytest backend/tests -v

      - name: Verify SQLite Migrations & Test Compatibility (Local Fallback)
        env:
          DATABASE_URL: sqlite:///./postcodelink_ci_test.db
          SECRET_KEY: "postcodelink_ci_secret_key_32_characters_minimum"
          OUTBOX_ENCRYPTION_KEY: "postcodelink_ci_outbox_key_32_characters_minimum"
          ENVIRONMENT: "development"
          REDIS_URL: "redis://localhost:6379/0"
        run: |
          python -m alembic upgrade head
          python -m backend.app.seed
          python -m pytest backend/tests -v

  frontend-verification:
    name: Frontend Build, TypeScript & State Machine Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install NPM Dependencies (Reproducible CI)
        run: npm ci

      - name: Run Frontend State Machine & Security Tests
        run: npm test

      - name: Execute ESLint Verification
        run: npm run lint

      - name: Verify Next.js Production Build
        run: npm run build
